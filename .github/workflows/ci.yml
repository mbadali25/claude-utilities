name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: cross-build linux and windows
        if: runner.os == 'Linux'
        shell: bash
        run: |
          GOOS=linux go build ./...
          GOOS=windows go build ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - name: _verify smoke and regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # exit 77 = skipped (cmd/ not built yet); anything else non-zero fails
          bash _verify/smoke.sh || [ $? -eq 77 ]
          bash _verify/run-all.sh
          bash _verify/cases/go-checks.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...

  # The service smoke: the real unit (Linux) or the real service (Windows), started, probed and torn
  # down on a disposable runner. Both legs are UNVERIFIED until their first green run - the plan's
  # inferences are that a windows-latest runner can CreateService under a virtual account, that
  # ubuntu-latest runs systemd as PID 1 with passwordless sudo, and that MemoryDenyWriteExecute=yes
  # suits the Go runtime - so the job is non-blocking. The same PR that sees a leg pass removes
  # continue-on-error. A ::warning:: does not fail a step, so a leg that cannot run says SKIPPED on the
  # job summary as well as in a warning (the runner offers no skipped state mid-job), and a leg that ran
  # and could not verify (Windows UNVERIFIED) fails: the repo rule is that a skip is not a pass.
  service-smoke:
    name: service-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: linux - render, install, start, probe, stop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # This installs a unit, a user and a credential. It runs on a disposable CI runner and nowhere else.
          [ "${GITHUB_ACTIONS:-}" = true ] || { echo "refusing to run outside GitHub Actions"; exit 1; }
          if [ ! -d /run/systemd/system ]; then
            echo "::warning::service-smoke SKIPPED: systemd is not PID 1 on this runner"
            echo -e "### service-smoke (linux): SKIPPED\nsystemd is not PID 1 on this runner. Nothing was verified; this is a skip, not a pass." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          T="$RUNNER_TEMP/smoke"; mkdir -p "$T/units"
          BIN=/usr/local/bin/claude-swap-server
          go build -o "$T/claude-swap-server" ./cmd/server
          sudo install -m 0755 "$T/claude-swap-server" "$BIN"

          # The units and the useradd arguments come from the renderers, not from this file.
          VERIFY_UNIT_DIR="$T/units" VERIFY_EXE="$BIN" VERIFY_DATA_DIR=/var/lib/claude-swap/data \
            VERIFY_LISTEN=127.0.0.1:18443 \
            go test -count=1 -run '^TestRenderUnitsForVerify$' ./internal/service
          mapfile -t UA < "$T/units/useradd.args"
          sudo useradd "${UA[@]}"
          sudo install -m 0644 "$T/units/server.service" /etc/systemd/system/claude-swap-server.service
          sudo install -m 0644 "$T/units/failed.service" /etc/systemd/system/claude-swap-server-failed.service
          sudo systemd-analyze verify /etc/systemd/system/claude-swap-server.service

          # A throwaway KEK in the credstore, a throwaway vault passphrase and admin password.
          sudo install -d -m 0700 /etc/credstore
          head -c 32 /dev/urandom | sudo tee /etc/credstore/claude-swap.vault-kek >/dev/null
          sudo chmod 600 /etc/credstore/claude-swap.vault-kek
          CLAUDESWAP_KEY="$(openssl rand -hex 16)"; ADMIN="$(openssl rand -hex 16)"
          echo "::add-mask::$CLAUDESWAP_KEY"; echo "::add-mask::$ADMIN"
          export CLAUDESWAP_KEY
          sudo install -d -m 0700 /var/lib/claude-swap /var/lib/claude-swap/data
          D=/var/lib/claude-swap/data
          sudo --preserve-env=CLAUDESWAP_KEY "$BIN" vault init --data-dir "$D"
          printf '%s\n' "$ADMIN" | sudo "$BIN" set-password --data-dir "$D"

          # migrate on a v2 data dir is the idempotent re-run that writes the KEK drop-in.
          sudo "$BIN" vault migrate --data-dir "$D" 2>&1 | tee "$T/migrate.out"
          die() { echo "::error::service-smoke: $*"; exit 1; }
          grep -q "KEK drop-in" "$T/migrate.out" || { cat -A "$T/migrate.out"; die "migrate did not report writing the KEK drop-in"; }
          sudo grep -qx 'LoadCredential=vault-kek:/etc/credstore/claude-swap.vault-kek' \
            /etc/systemd/system/claude-swap-server.service.d/10-kek.conf \
            || die "the drop-in does not carry the plain LoadCredential line"
          sudo chown -R claude-swap:claude-swap /var/lib/claude-swap

          # Start. Type=notify, so `start` returns only once the server reported READY.
          sudo systemctl start claude-swap-server || die "systemctl start failed"
          state="$(systemctl show -p ActiveState --value claude-swap-server)"
          echo "ActiveState=$state SubState=$(systemctl show -p SubState --value claude-swap-server)"
          [ "$state" = active ] || die "the unit is not active: $state"
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/ || true)"
          echo "GET / -> $code"
          case "$code" in [1-5][0-9][0-9]) : ;; *) die "no HTTP answer from the server" ;; esac
          # Configured is not delivering: a line must have reached the journal.
          sudo journalctl -u claude-swap-server -o cat --no-pager | tee "$T/journal.out"
          grep -q "listening on https://" "$T/journal.out" || die "no 'listening on' line reached the journal"
          sudo systemctl stop claude-swap-server
          result="$(systemctl show -p Result --value claude-swap-server)"
          [ "$result" = success ] || die "the unit stopped with Result=$result"
      - name: linux - journal on failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl status claude-swap-server --no-pager -l || true
          sudo journalctl -u claude-swap-server -u claude-swap-server-failed -o cat --no-pager | tail -n 60 || true
          sudo cat /etc/systemd/system/claude-swap-server.service.d/10-kek.conf || true
      - name: windows - install, start, probe, stop, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $T = Join-Path $env:RUNNER_TEMP 'smoke'; New-Item -ItemType Directory -Force $T | Out-Null
          $exe = Join-Path $T 'claude-swap-server.exe'
          $data = Join-Path $T 'data'
          go build -o $exe ./cmd/server
          if ($LASTEXITCODE) { throw 'build failed' }
          $env:CLAUDESWAP_KEY = -join ((48..57 + 97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          $admin = -join ((48..57 + 97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          Write-Output "::add-mask::$($env:CLAUDESWAP_KEY)"; Write-Output "::add-mask::$admin"
          & $exe vault init --data-dir $data
          if ($LASTEXITCODE) { throw "vault init exited $LASTEXITCODE" }
          $admin | & $exe set-password --data-dir $data
          if ($LASTEXITCODE) { throw "set-password exited $LASTEXITCODE" }
          $installOut = & $exe service install --data-dir $data --listen 127.0.0.1:18443 2>&1 | Out-String
          Write-Output $installOut
          if ($LASTEXITCODE) {
            # Skipped only when the runner refuses the registration itself; any other install failure is one.
            if ($installOut -match 'Access is denied|access denied|privilege') {
              Write-Output "::warning::service-smoke SKIPPED: the runner refused CreateService ($LASTEXITCODE)"
              if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### service-smoke (windows): SKIPPED`nThe runner refused CreateService. Nothing was verified; this is a skip, not a pass." }
              exit 0
            }
            throw "service install exited $LASTEXITCODE"
          }
          $unverified = $false
          try {
            & $exe service start --data-dir $data
            if ($LASTEXITCODE) { throw "service start exited $LASTEXITCODE" }
            $code = ''
            foreach ($i in 1..20) {
              $code = (curl.exe -sk -o NUL -w '%{http_code}' https://127.0.0.1:18443/) 2>$null
              if ($code -match '^[1-5][0-9][0-9]$') { break }
              Start-Sleep -Seconds 1
            }
            Write-Output "GET / -> $code"
            if ($code -notmatch '^[1-5][0-9][0-9]$') { throw 'no HTTP answer from the service' }
            & $exe service stop --data-dir $data
            if ($LASTEXITCODE) { throw "service stop exited $LASTEXITCODE" }
            $log = Join-Path $data 'logs\server.log'
            if (-not (Test-Path $log) -or (Get-Item $log).Length -eq 0) { throw 'the service wrote no log line' }
          } catch {
            Write-Output "::error::service-smoke: $($_.Exception.Message)"
            & $exe service status --data-dir $data
            $log = Join-Path $data 'logs\server.log'
            if (Test-Path $log) { Get-Content $log -Tail 40 } else { Write-Output "(no $log)" }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'ClaudeSwapServer' } -MaxEvents 10 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Message }
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 6 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Message }
            # Separate "the service account cannot run it" from "it cannot run": the same data dir, as the runner admin on the console.
            & $exe service stop --data-dir $data 2>&1 | Out-Null
            $p = Start-Process -FilePath $exe -ArgumentList 'run','--listen','127.0.0.1:18444','--data-dir',$data -RedirectStandardError "$T\console.err" -RedirectStandardOutput "$T\console.out" -PassThru -NoNewWindow
            Start-Sleep -Seconds 6
            $exited = $p.HasExited
            if (-not $exited) { Stop-Process -Id $p.Id -Force }
            Write-Output "console run: exited=$exited"
            Get-Content "$T\console.err" -Tail 15 -ErrorAction SilentlyContinue
            # The plan's stated fallback for the inference that a runner can start a service under a virtual
            # account: if the same data dir runs fine on the console, the leg is UNVERIFIED (a visible warning,
            # never a silent pass), and the cause is chased on a real host. Anything else is a failure.
            if (-not $exited) { $unverified = $true } else { throw }
          } finally {
            & $exe service uninstall --data-dir $data
          }
          if (Get-Service -Name ClaudeSwapServer -ErrorAction SilentlyContinue) { throw 'the service is still registered after uninstall' }
          if ($unverified) {
            # A ::warning:: does not fail a step, so a leg that verified nothing would show green. This
            # leg fails instead (the job is continue-on-error, so the run is not blocked) and says so on
            # the job summary: UNVERIFIED is not a pass.
            $msg = "service-smoke Windows leg UNVERIFIED, NOT A PASS: the service exited 1 (reason=runtime) under NT SERVICE\ClaudeSwapServer on this runner, while the same data dir runs on the console."
            Write-Output "::error::$msg"
            if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### service-smoke (windows): UNVERIFIED`n$msg" }
            exit 1
          }
