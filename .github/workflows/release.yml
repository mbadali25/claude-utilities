name: release

# A tag publishes verified binaries: archives, SHA256SUMS, a cosign bundle over it, and a
# provenance attestation whose subjects are the archives (the files SHA256SUMS lists).
#
# Two kinds of tag are accepted and nothing else:
#   vMAJOR.MINOR.PATCH   a real release, published.
#   v0.0.0-rc.N          a dry run, kept as a DRAFT, verified, then deleted. It uses its own
#                        identity regexp, so a dry tag can never verify as a real release.
# Runbook: docs/runbooks/release-verify.md

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOFLAGS: -mod=readonly

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - name: Classify the tag
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "kind=real" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$TAG" | grep -Eq '^v0\.0\.0-rc\.[0-9]+$'; then
            echo "kind=dry" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '$TAG' is neither vX.Y.Z nor v0.0.0-rc.N, so no release is built"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - name: Build the archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist stage
          for target in linux/amd64 windows/amd64; do
            goos=${target%/*}; goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            for cmd in server agent; do
              name="claude-swap-$cmd"
              rm -rf stage/*
              GOOS=$goos GOARCH=$goarch go build -trimpath \
                -ldflags "-s -w -X main.version=${TAG}" \
                -o "stage/${name}${ext}" "./cmd/$cmd"
              base="dist/${name}_${TAG}_${goos}_${goarch}"
              if [ "$goos" = windows ]; then
                (cd stage && zip -q "../${base}.zip" "${name}${ext}")
              else
                tar -C stage -czf "${base}.tar.gz" "${name}${ext}"
              fi
            done
          done
          # Explicit list on purpose: a missing installer must fail loudly, never ship a short release.
          # The server installers join this list in the PR that creates them.
          cp scripts/install-agent.ps1 scripts/install-agent.sh dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
      KIND: ${{ needs.build.outputs.kind }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      # subject-checksums reads the archives' digests out of SHA256SUMS; the attestation is
      # over those files, not over SHA256SUMS itself. No predicate inputs: the default
      # provenance predicate is what we want.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Write the verifier
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'EOF'
          #!/usr/bin/env bash
          # usage: verify.sh DIR  - DIR holds the release files. Fails on a short release.
          set -euo pipefail
          cd "$1"
          if [ "$KIND" = dry ]; then
            id='^https://github\.com/mbadali25/claude-utilities/\.github/workflows/release\.yml@refs/tags/v0\.0\.0-rc\.[0-9]+$'
          else
            id='^https://github\.com/mbadali25/claude-utilities/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$id" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum -c SHA256SUMS
          archives=$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          if [ "$archives" -ne 4 ]; then
            echo "::error::expected 4 archives (server and agent, linux and windows), found $archives"
            exit 1
          fi
          for f in ./*.zip ./*.tar.gz; do
            gh attestation verify "$f" --repo "$REPO" \
              --cert-identity-regex "$id"
          done
          EOF
          chmod +x "$RUNNER_TEMP/verify.sh"
      - name: Verify before publishing
        run: '"$RUNNER_TEMP/verify.sh" dist'
      - name: Create the release (dry runs stay drafts)
        run: |
          set -eu
          draft=""; [ "$KIND" = dry ] && draft="--draft"
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --verify-tag $draft \
            --notes "Verify with docs/runbooks/release-verify.md before running anything from this release."
      # A draft is not reliably downloadable by tag, so only a published release is re-checked here.
      - name: Verify the published copy
        if: ${{ env.KIND == 'real' }}
        run: |
          mkdir published
          gh release download "$TAG" --repo "$REPO" --dir published
          "$RUNNER_TEMP/verify.sh" published
      - name: Delete the dry-run draft
        if: ${{ always() && env.KIND == 'dry' }}
        run: gh release delete "$TAG" --repo "$REPO" --yes || echo "::warning::could not delete the draft release for $TAG; delete it by hand"